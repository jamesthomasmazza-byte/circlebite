# Reference copy of the live config at /etc/nginx/sites-available/circlebite.app — for
# documentation only. nginx doesn't read from a git checkout; the file on the box is the
# operative one, and this repo copy is kept in sync by hand whenever it changes there.
#
# The certbot-managed blocks (SSL directives, the HTTP->HTTPS redirect server block) were
# generated by `certbot --nginx` and must never be hand-edited or regenerated from this file —
# only the `location /` block in the first server block is meant to be touched, which is what
# switched this from serving a static placeholder (root/index/try_files) to reverse-proxying the
# Node app. See docs/server-setup.md for the rollback command, which restores a backup of the
# placeholder-serving version kept on the box as circlebite.app.pre-node-backup.

server {
    server_name circlebite.app www.circlebite.app;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/circlebite.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/circlebite.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.circlebite.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = circlebite.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name circlebite.app www.circlebite.app;
    return 404; # managed by Certbot




}
