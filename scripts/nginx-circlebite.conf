# Reference copy of the live config at /etc/nginx/sites-available/circlebite.app — for
# documentation only. nginx doesn't read from a git checkout; the file on the box is the
# operative one, and this repo copy is kept in sync by hand whenever it changes there.
#
# The certbot-managed blocks (SSL directives, the HTTP->HTTPS redirect server block) were
# generated by `certbot --nginx` and must never be hand-edited or regenerated from this file —
# only the `location /` block and the directives above it in the first server block are meant to
# be touched. The `location /` block is what switched this from serving a static placeholder
# (root/index/try_files) to reverse-proxying the Node app. See docs/server-setup.md §9 for the
# rollback command, which restores a backup of the placeholder-serving version kept on the box as
# circlebite.app.pre-node-backup, and §8a for the gzip lines (backup: circlebite.app.pre-gzip).

server {
    server_name circlebite.app www.circlebite.app;

    # Tied to MAX_PHOTO_BYTES (8MB, server/src/corrections/photoStorage.ts). nginx's default is 1m,
    # which returned 413 before a correction photo ever reached Node while the server allowed 8MB.
    # Deliberately ABOVE MAX_PHOTO_BYTES, not equal to it: this limits the whole request body, and a
    # multipart upload is the file plus its envelope (boundaries, part headers, the other form
    # fields). At 8m, a photo just under the app's own limit would be refused here first. Don't
    # "fix" this to match — raise both together, keeping this one about a megabyte higher.
    client_max_body_size 9m;

    # Compress text responses on their way out (2026-10-29, docs/server-setup.md §8a). Before this,
    # the 729 kB JS bundle went over the wire uncompressed — about 206 kB gzipped. text/html is
    # always compressed once gzip is on; these add the rest the app sends: the bundle (Express 4
    # sends application/javascript; text/javascript is listed for when it sends that instead), CSS,
    # the API's JSON and SVG. Vary: Accept-Encoding so a shared cache never hands a gzipped copy to
    # a client that didn't ask for one. Images are already compressed and aren't listed.
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/circlebite.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/circlebite.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.circlebite.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = circlebite.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name circlebite.app www.circlebite.app;
    return 404; # managed by Certbot




}
